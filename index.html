    headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":opts.prefer||"return=representation",...(opts.headers||{})},

const TZ="America/Toronto";
function todayMTL(){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getMondayMTL(ds){const d=new Date(ds+"T12:00:00"),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d.toISOString().slice(0,10);}
function getCurrentWeekWorkouts(wos){const mon=getMondayMTL(todayMTL()),sun=new Date(mon+"T00:00:00");sun.setDate(sun.getDate()+6);const sunS=sun.toISOString().slice(0,10);return wos.filter(w=>w.date>=mon&&w.date<=sunS);}
function getWeekKey(ds){const d=new Date(ds+"T12:00:00"),j=new Date(d.getFullYear(),0,1),wk=Math.ceil(((d-j)/86400000+j.getDay()+1)/7);return `${d.getFullYear()}-W${String(wk).padStart(2,"0")}`;}

const KG_TO_LB=2.20462,LB_TO_KG=0.453592;
function toLb(kg){return Math.round(kg*KG_TO_LB*4)/4;}
function toKg(lb){return Math.round(lb*LB_TO_KG*4)/4;}
function dispW(kg,unit){return unit==="lb"?toLb(kg):Math.round(kg*10)/10;}
function storeW(val,unit){return unit==="lb"?toKg(parseFloat(val)||0):parseFloat(val)||0;}
function calc1RM(w,r){return r===0?0:Math.round(w*(1+r/30));}
function calcVolume(wo){return wo.exercises.reduce((t,ex)=>t+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0),0);}

function importDailyLog(data,date){
  if(!data||!Array.isArray(data.exercises)) return null;
  const exercises=data.exercises.filter(ex=>ex.name&&Array.isArray(ex.sets)&&ex.sets.length>0).map(ex=>{
    const srcUnit=(ex.unit||"lbs").toLowerCase().includes("lb")?"lb":"kg";
    const sets=ex.sets.filter(s=>s.weight!==""&&s.reps!=="").map(s=>{
      const wRaw=parseFloat(s.weight)||0;
      return{w:srcUnit==="lb"?toKg(wRaw):wRaw,r:parseInt(s.reps)||0,type:"normal"};
    }).filter(s=>s.r>0);
    if(sets.length===0) return null;
    return{name:ex.name,muscle:ex.muscle||"",splitSides:false,sets};
  }).filter(Boolean);
  if(exercises.length===0) return null;
  return{id:"import_"+date,date,type:"Workout",exercises};
}

const TIMER_KEY="gymtracker_timer_v1";
function timerSave(endTs,total){try{localStorage.setItem(TIMER_KEY,JSON.stringify({endTs,total}));}catch{}}
function timerClear(){try{localStorage.removeItem(TIMER_KEY);}catch{}}
function timerLoad(){try{const r=localStorage.getItem(TIMER_KEY);return r?JSON.parse(r):null;}catch{return null;}}
function timerRemaining(s){return s?Math.max(0,Math.ceil((s.endTs-Date.now())/1000)):0;}

function RestTimer(){
  const saved=timerLoad(),initRem=timerRemaining(saved);
  const [running,setRunning]=useState(!!(saved&&initRem>0));
  const [secs,setSecs]=useState(saved&&initRem>0?initRem:(saved?.total??120));
  const [def,setDef]=useState(saved?.total??120);
  const [done,setDone]=useState(!!(saved&&initRem===0&&saved.endTs));
  const [showCustom,setShowCustom]=useState(false);
  const [cm,setCm]=useState("");const [cs,setCs]=useState("");
  const ivRef=useRef(null);
  const tick=useCallback(()=>{
    const s=timerLoad();if(!s){clearInterval(ivRef.current);return;}
    const rem=timerRemaining(s);setSecs(rem);
    if(rem<=0){clearInterval(ivRef.current);timerClear();setRunning(false);setDone(true);}
  },[]);
  useEffect(()=>{
    if(running) ivRef.current=setInterval(tick,500);
    else clearInterval(ivRef.current);
    const onVis=()=>{if(document.visibilityState==="visible")tick();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(ivRef.current);document.removeEventListener("visibilitychange",onVis);};
  },[running,tick]);
  function start(s){clearInterval(ivRef.current);timerSave(Date.now()+s*1000,s);setDef(s);setSecs(s);setRunning(true);setDone(false);ivRef.current=setInterval(tick,500);}
  function stop(){clearInterval(ivRef.current);timerClear();setRunning(false);setDone(false);setSecs(def);}
  function applyCustom(){const s=(+cm||0)*60+(+cs||0);if(s>0){start(s);setShowCustom(false);}}
  const m=Math.floor(secs/60),s2=secs%60,pct=secs/def,circ=2*Math.PI*38;
  const col=done?"#c8f135":running?"#4488ff":"#5a5a5a";
  return(
    <div style={{background:"#181818",borderRadius:10,padding:"12px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
      <div style={{position:"relative",width:52,height:52,flexShrink:0}}>
        <svg width="52" height="52" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="38" fill="none" stroke="#2a2a2a" strokeWidth={5}/>
          <circle cx="40" cy="40" r="38" fill="none" stroke={col} strokeWidth={5} strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" transform="rotate(-90 40 40)" style={{transition:"stroke-dashoffset 1s linear,stroke 0.3s"}}/>
          <text x="50%" y="58%" textAnchor="middle" fill={col} style={{fontSize:18,fontWeight:700,fontFamily:"monospace"}}>{String(m).padStart(2,"0")}:{String(s2).padStart(2,"0")}</text>
        </svg>
      </div>
      <div style={{flex:1}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:7}}>
          {[["1m",60],["1m30",90],["2m",120],["3m",180]].map(([l,v])=>(
            <button key={v} onClick={()=>start(v)} style={{...S.btnSm(def===v&&running),padding:"4px 10px",fontSize:11}}>{l}</button>
          ))}
          <button onClick={()=>setShowCustom(x=>!x)} style={{...S.btnSm(false),padding:"4px 10px",fontSize:11}}>Custom</button>
        </div>
        {showCustom&&(
          <div style={{display:"flex",gap:5,marginBottom:7,alignItems:"center"}}>
            <input type="number" placeholder="min" value={cm} onChange={e=>setCm(e.target.value)} style={{...S.input,width:52,textAlign:"center",padding:"4px"}}/>
            <span style={{color:"#5a5a5a"}}>:</span>
            <input type="number" placeholder="sec" value={cs} onChange={e=>setCs(e.target.value)} style={{...S.input,width:52,textAlign:"center",padding:"4px"}}/>
            <button onClick={applyCustom} style={{...S.btnP,padding:"5px 10px",fontSize:12}}>OK</button>
          </div>
        )}
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          {running&&<button onClick={stop} style={{...S.btnG,padding:"5px 12px",fontSize:12,color:"#ff4444",borderColor:"#ff4444"}}>■ Stop</button>}
          {done&&<button onClick={()=>{setDone(false);setSecs(def);}} style={{...S.btnP,padding:"5px 12px",fontSize:12}}>↺ Reset</button>}
          {!running&&!done&&<div style={{fontSize:11,color:"#5a5a5a",paddingTop:6}}>⏱ Sélectionne une durée</div>}
          {done&&<div style={{fontSize:13,fontWeight:700,color:"#c8f135"}}>🔔 Go ! 💪</div>}
        </div>
      </div>
    </div>
  );
}

function ExerciseSearch({allExercises,value,onChange,onSelect}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState(value||"");
  const ref=useRef();
  useEffect(()=>{setQ(value||"");},[value]);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  const results=useMemo(()=>{
    if(!q.trim()) return allExercises.slice(0,10);
    const ql=q.toLowerCase();
    return[...allExercises.filter(e=>e.muscle.toLowerCase().includes(ql)),...allExercises.filter(e=>e.name.toLowerCase().includes(ql)&&!e.muscle.toLowerCase().includes(ql))].slice(0,20);
  },[q,allExercises]);
  return(
    <div ref={ref} style={{position:"relative",flex:1}}>
      <input style={S.input} value={q} onChange={e=>{setQ(e.target.value);onChange(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} placeholder="Muscle ou exercice…"/>
      {open&&results.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:200,background:"#121212",border:"1px solid #262626",borderRadius:8,maxHeight:220,overflowY:"auto",marginTop:4}}>
          {results.map(ex=>(
            <div key={ex.name} onMouseDown={()=>{onSelect(ex);setQ(ex.name);setOpen(false);}} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #2a2a2a"}} onMouseEnter={e=>e.currentTarget.style.background="#181818"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:13,color:"#f0f0f0"}}>{ex.name}</span>
              <span style={{fontSize:11,color:"#5a5a5a"}}>{ex.muscle}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ExerciseHistory({exName,workouts,unit,currentId}){
  const [open,setOpen]=useState(false);
  if(!exName) return null;
  let pr={w:0,r:0,orm:0,date:""};
  workouts.forEach(wo=>{
    if(wo.id===currentId) return;
    wo.exercises.forEach(ex=>{
      if(ex.name!==exName) return;
      ex.sets.forEach(set=>{const orm=calc1RM(set.w,set.r);if(orm>pr.orm)pr={w:set.w,r:set.r,orm,date:wo.date};});
    });
  });
  const lastWo=[...workouts].filter(wo=>wo.id!==currentId&&wo.exercises.some(e=>e.name===exName)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastEx=lastWo?.exercises.find(e=>e.name===exName);
  const dw=kg=>Math.round(dispW(kg,unit)*10)/10;
  if(!pr.orm&&!lastEx) return null;
  return(
    <div style={{marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{...S.btnG,fontSize:11,padding:"4px 10px",display:"flex",alignItems:"center",gap:6}}>
        <span>📊</span>
        {pr.orm>0&&<span style={{color:"#c8f135"}}>PR: {dw(pr.w)}{unit} × {pr.r} (~{dw(calc1RM(pr.w,pr.r))}{unit})</span>}
        {lastEx&&<span style={{color:"#5a5a5a"}}>· Dernière: {lastWo.date}</span>}
        <span style={{color:"#5a5a5a"}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{background:"#181818",borderRadius:8,padding:"10px 12px",marginTop:6,fontSize:12}}>
          {pr.orm>0&&<div style={{marginBottom:8}}><span style={{color:"#c8f135",fontWeight:600}}>🏆 PR — </span><span style={{color:"#f0f0f0"}}>{dw(pr.w)}{unit} × {pr.r} · {pr.date}</span><span style={{color:"#5a5a5a",marginLeft:8}}>1RM ~{dw(calc1RM(pr.w,pr.r))}{unit}</span></div>}
          {lastEx&&(
            <div>
              <div style={{color:"#5a5a5a",marginBottom:4,fontWeight:600}}>Dernière — {lastWo.date}</div>
              {lastEx.sets.map((set,i)=>(
                <div key={i} style={{color:"#f0f0f0",padding:"2px 0"}}>
                  <span style={{color:"#5a5a5a"}}>S{i+1}</span> {dw(set.w)}{unit} × {set.r} reps
                  {lastEx.splitSides&&set.wL!=null&&<span style={{color:"#5a5a5a"}}> (G: {dw(set.wL)}{unit} × {set.rL})</span>}
                  <span style={{color:"#8aaa1f",marginLeft:6}}>~{dw(calc1RM(set.w,set.r))}{unit}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SetRow({set,idx,onChange,onRemove,unit,splitSides}){
  const dw=kg=>kg==null?"":(Math.round(dispW(kg,unit)*10)/10);
  const TC={warmup:"#4488ff",normal:"#c8f135",dropset:"#ff8c42"};
  return(
    <div style={{display:"flex",alignItems:"center",gap:5,background:"#1e1e1e",borderRadius:8,padding:"7px 10px",marginBottom:5,flexWrap:"wrap"}}>
      <span style={{fontSize:11,color:"#5a5a5a",minWidth:20}}>S{idx+1}</span>
      <div style={{display:"flex",gap:3}}>
        {["warmup","normal","dropset"].map(t=>(
          <button key={t} onClick={()=>onChange({...set,type:t})} style={{...S.btnSm(set.type===t,TC[t]),padding:"2px 7px",fontSize:10}}>
            {t==="warmup"?"🔥W":t==="normal"?"●N":"↓D"}
          </button>
        ))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>

        <span style={{fontSize:11,color:"#5a5a5a"}}>{unit} ×</span>
        <input type="number" value={set.r} onChange={e=>onChange({...set,r:+e.target.value})} style={{...S.input,width:50,textAlign:"center",padding:"4px 5px"}}/>
        <span style={{fontSize:11,color:"#5a5a5a"}}>reps</span>
        <span style={{fontSize:10,color:"#8aaa1f"}}>~{Math.round(dispW(calc1RM(set.w,set.r),unit))}{unit}</span>

    </div>
  );
}

function ExerciseBlock({ex,onChange,onRemove,workouts,unit,currentId,allExercises}){
  const addSet=()=>{const l=ex.sets.slice(-1)[0]||{w:0,r:8,type:"normal"};onChange({...ex,sets:[...ex.sets,{...l,type:"normal"}]});};
  const updateSet=(si,s)=>onChange({...ex,sets:ex.sets.map((x,i)=>i===si?s:x)});
  const removeSet=si=>ex.sets.length>1&&onChange({...ex,sets:ex.sets.filter((_,i)=>i!==si)});
  return(
    <div style={{...S.card,borderLeft:"3px solid #c8f135",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        <ExerciseSearch allExercises={allExercises} value={ex.name} onChange={name=>onChange({...ex,name})} onSelect={found=>onChange({...ex,name:found.name,muscle:found.muscle})}/>
        <span style={{fontSize:11,color:"#5a5a5a",minWidth:70,textAlign:"right"}}>{ex.muscle}</span>
        <button onClick={()=>onChange({...ex,splitSides:!ex.splitSides})} style={{...S.btnSm(ex.splitSides,"#b44fff"),padding:"4px 9px",fontSize:11}}>G/D</button>
        <button onClick={onRemove} style={{background:"none",border:"none",cursor:"pointer",color:"#5a5a5a",fontSize:18}}>×</button>
      </div>
      <ExerciseHistory exName={ex.name} workouts={workouts} unit={unit} currentId={currentId}/>
      {ex.sets.map((set,si)=>(
        <SetRow key={si} set={set} idx={si} unit={unit} splitSides={ex.splitSides} onChange={s=>updateSet(si,s)} onRemove={()=>removeSet(si)}/>
      ))}
      <button onClick={addSet} style={{...S.btnG,fontSize:11,padding:"4px 11px",marginTop:4}}>+ set</button>
    </div>
  );
}

function WeeklyMuscleMap({workouts,unit}){
  const [hovered,setHovered]=useState(null);
  const weekWos=getCurrentWeekWorkouts(workouts);
  const monday=getMondayMTL(todayMTL());
  const sun=new Date(monday+"T00:00:00");sun.setDate(sun.getDate()+6);
  const weekVol={};
  weekWos.forEach(w=>w.exercises.forEach(ex=>{const vol=ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);weekVol[ex.muscle]=(weekVol[ex.muscle]||0)+vol;}));
  const maxVol=Math.max(...Object.values(weekVol),1);
  const mi={};Object.entries(weekVol).forEach(([m,v])=>{mi[m]=v/maxVol;});
  const fmt=d=>d.toLocaleDateString("fr-CA",{month:"short",day:"numeric"});
  const dw=kg=>Math.round(dispW(kg,unit));
  return(
    <div style={{...S.card,height:"100%"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={S.label}>Muscles cette semaine</div>
        <span style={{fontSize:11,color:"#5a5a5a",background:"#181818",padding:"3px 8px",borderRadius:4}}>{fmt(new Date(monday+"T12:00:00"))} – {fmt(sun)}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:14,alignItems:"start"}}>
        <BodyMap muscleIntensity={mi} hoveredMuscle={hovered} onHover={setHovered}/>
        <div>
          {hovered&&weekVol[hovered]&&<div style={{background:"#181818",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #c8f13540"}}><div style={{fontSize:13,fontWeight:600,color:"#c8f135"}}>{hovered}</div><div style={{fontSize:12,color:"#5a5a5a",marginTop:2}}>{dw(weekVol[hovered]).toLocaleString()} {unit}</div></div>}
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {ALL_MUSCLES.map(m=>{
              const vol=weekVol[m]||0,pct=vol/maxVol,done=vol>0;
              return(
                <div key={m} onMouseEnter={()=>setHovered(m)} onMouseLeave={()=>setHovered(null)} style={{cursor:"pointer",opacity:hovered&&hovered!==m?0.45:1,transition:"opacity 0.15s"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                    <span style={{fontSize:11,color:done?"#f0f0f0":"#5a5a5a",fontWeight:done?500:400}}>{m}</span>
                    <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:done?"#c8f135":"#2a2a2a"}}>{done?`${dw(vol).toLocaleString()} ${unit}`:"—"}</span>
                  </div>
                  <div style={{height:3,background:"#2a2a2a",borderRadius:2,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${pct*100}%`,borderRadius:2,background:done?muscleColor(pct):"transparent",transition:"width 0.4s"}}/>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center",marginTop:12}}>
            <span style={{fontSize:10,color:"#5a5a5a"}}>Intensité :</span>
            {["#1a3a10","#2d6b18","#5aa62a","#c8f135"].map((c,i)=><div key={i} style={{width:11,height:11,borderRadius:2,background:c}}/>)}
            <span style={{fontSize:10,color:"#5a5a5a"}}>max</span>
          </div>
          <div style={{fontSize:10,color:"#2a2a2a",marginTop:5}}>↺ Reset lundi (Montréal)</div>
        </div>
      </div>
    </div>
  );
}

function Dashboard({workouts,unit,setUnit}){
  const weeks={};
  workouts.forEach(w=>{
    const k=getWeekKey(w.date);
    if(!weeks[k])weeks[k]={key:k,vol:0,sets:0,workouts:0,muscles:{}};
    weeks[k].vol+=calcVolume(w);weeks[k].workouts++;
    w.exercises.forEach(ex=>{weeks[k].sets+=ex.sets.length;weeks[k].muscles[ex.muscle]=(weeks[k].muscles[ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);});
  });
  const wArr=Object.values(weeks).sort((a,b)=>a.key.localeCompare(b.key));
  const cur=wArr[wArr.length-1]||{vol:0,sets:0,workouts:0,muscles:{}};
  const prev=wArr[wArr.length-2]||{vol:0,sets:0,workouts:0,muscles:{}};
  const volD=prev.vol>0?Math.round((cur.vol-prev.vol)/prev.vol*100):0;
  const setsD=prev.sets>0?Math.round((cur.sets-prev.sets)/prev.sets*100):0;
  const dw=kg=>Math.round(dispW(kg,unit));
  const volumeData=wArr.map(w=>({week:w.key.replace(/\d{4}-/,""),vol:dw(w.vol)}));
  const muscleTotals={};
  workouts.forEach(w=>w.exercises.forEach(ex=>{muscleTotals[ex.muscle]=(muscleTotals[ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);}));
  const radarData=Object.entries(muscleTotals).map(([m,v])=>({muscle:m,volume:Math.round(dw(v)/100)}));
  const compareData=Object.keys(cur.muscles||{}).map(m=>({muscle:m.substring(0,4),current:dw(cur.muscles[m]||0),previous:dw(prev.muscles?.[m]||0)}));

  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><UnitToggle unit={unit} onChange={setUnit}/></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>

          <div key={i} style={S.card}><div style={S.label}>{kpi.label}</div><div style={S.val}>{kpi.val}</div>{kpi.delta!==null&&<div style={S.delta(kpi.delta>=0)}>{kpi.delta>=0?"▲":"▼"} {Math.abs(kpi.delta)}% vs S-1</div>}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:14}}>
        <WeeklyMuscleMap workouts={workouts} unit={unit}/>
        <div style={S.card}>
          <div style={S.label}>Radar musculaire</div>
          <ResponsiveContainer width="100%" height={340}><RadarChart data={radarData}><PolarGrid stroke="#2a2a2a"/><PolarAngleAxis dataKey="muscle" tick={{fill:"#5a5a5a",fontSize:10}}/><Radar dataKey="volume" stroke="#c8f135" fill="#c8f135" fillOpacity={0.15} strokeWidth={2}/></RadarChart></ResponsiveContainer>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={S.card}>
          <div style={S.label}>Volume par semaine ({unit})</div>
          <ResponsiveContainer width="100%" height={180}><BarChart data={volumeData} barCategoryGap="35%"><CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a"/><XAxis dataKey="week" tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><Tooltip {...TT} formatter={v=>[`${v} ${unit}`,"Volume"]}/><Bar dataKey="vol" fill="#c8f135" radius={[4,4,0,0]}/></BarChart></ResponsiveContainer>
        </div>
        <div style={S.card}>
          <div style={S.label}>S actuelle vs S-1 ({unit})</div>
          <ResponsiveContainer width="100%" height={180}><BarChart data={compareData} barCategoryGap="30%"><CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a"/><XAxis dataKey="muscle" tick={{fill:"#5a5a5a",fontSize:10}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><Tooltip {...TT}/><Legend wrapperStyle={{fontSize:11,color:"#5a5a5a"}}/><Bar dataKey="previous" name="S-1" fill="#2a2a2a" radius={[3,3,0,0]}/><Bar dataKey="current" name="Cette semaine" fill="#c8f135" radius={[3,3,0,0]}/></BarChart></ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function LogWorkout({onSave,workouts,programs,unit,setUnit,allExercises}){
  const [type,setType]=useState("Push");
  const [date,setDate]=useState(todayMTL());
  const [exercises,setExercises]=useState([]);
  const [showTimer,setShowTimer]=useState(false);
  const wid=useRef("new_"+Date.now());
  const loadProgram=useCallback((name)=>{
    const prog=programs.find(p=>p.name===name);
    if(!prog){setExercises([]);return;}
    const exs=prog.exercises.map(n=>{const f=allExercises.find(e=>e.name===n)||{name:n,muscle:""};return{name:f.name,muscle:f.muscle,splitSides:false,sets:[{w:0,r:8,type:"normal"}]};});
    setExercises(exs.length>0?exs:[{name:"",muscle:"",splitSides:false,sets:[{w:0,r:8,type:"normal"}]}]);
  },[programs,allExercises]);
  useEffect(()=>{loadProgram(type);},[type]);
  const addEx=()=>setExercises(e=>[...e,{name:"",muscle:"",splitSides:false,sets:[{w:0,r:8,type:"normal"}]}]);
  const removeEx=i=>exercises.length>1&&setExercises(e=>e.filter((_,j)=>j!==i));
  const updateEx=(i,ex)=>setExercises(e=>e.map((x,j)=>j===i?ex:x));
  return(
    <div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <select value={type} onChange={e=>setType(e.target.value)} style={{...S.select,flex:1,minWidth:160}}>{programs.map(p=><option key={p.id}>{p.name}</option>)}</select>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...S.input,width:"auto"}}/>
        <UnitToggle unit={unit} onChange={setUnit}/>
        <button onClick={()=>setShowTimer(x=>!x)} style={{...S.btnSm(showTimer,"#4488ff"),padding:"7px 12px",fontSize:12}}>⏱ Chrono</button>
      </div>
      {showTimer&&<RestTimer/>}
      {exercises.map((ex,i)=>(
        <ExerciseBlock key={i} ex={ex} workouts={workouts} currentId={wid.current} allExercises={allExercises} unit={unit} onChange={ex=>updateEx(i,ex)} onRemove={()=>removeEx(i)}/>
      ))}
      <div style={{display:"flex",gap:10,marginTop:4}}>
        <button onClick={addEx} style={S.btnG}>+ Exercice</button>
        <button onClick={()=>{
          const validEx=exercises.filter(ex=>ex.name&&ex.sets.some(s=>s.r>0));
          if(validEx.length===0) return;
          onSave({id:wid.current,date,type,exercises:validEx});
          wid.current="new_"+Date.now();
        }} style={S.btnP}>Sauvegarder séance</button>
      </div>
    </div>
  );
}

function Progress({workouts,unit,setUnit}){
  const [exFilter,setExFilter]=useState("all");
  const [exSearch,setExSearch]=useState("");
  const exNames=[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort();
  const filteredNames=useMemo(()=>{
    if(!exSearch.trim()) return exNames;
    const q=exSearch.toLowerCase();
    return exNames.filter(n=>n.toLowerCase().includes(q));
  },[exSearch,exNames]);
  const COLORS=["#c8f135","#4488ff","#ff8c42","#b44fff","#ff4488","#44ffdd"];
  const dw=kg=>Math.round(dispW(kg,unit)*10)/10;
  const byEx={};
  workouts.forEach(w=>{w.exercises.forEach(ex=>{
    if(exFilter!=="all"&&ex.name!==exFilter) return;
    if(!byEx[ex.name])byEx[ex.name]=[];
    const maxORM=Math.max(...ex.sets.map(s=>calc1RM(s.w,s.r)));
    byEx[ex.name].push({date:w.date.slice(5),orm:dw(maxORM)});
  });});
  const allDates=[...new Set(workouts.map(w=>w.date))].sort().map(d=>d.slice(5));
  const lineData=allDates.map(d=>{const pt={date:d};Object.entries(byEx).forEach(([n,pts])=>{const f=pts.find(p=>p.date===d);if(f)pt[n]=f.orm;});return pt;});
  const prs={};
  workouts.forEach(w=>w.exercises.forEach(ex=>{ex.sets.forEach(set=>{const orm=calc1RM(set.w,set.r);if(!prs[ex.name]||orm>prs[ex.name].orm)prs[ex.name]={weight:set.w,reps:set.r,orm,date:w.date};});}));
  const muscleWeeks={};
  workouts.forEach(w=>{const wk=getWeekKey(w.date).replace(/\d{4}-/,"");w.exercises.forEach(ex=>{if(!muscleWeeks[wk])muscleWeeks[wk]={};muscleWeeks[wk][ex.muscle]=(muscleWeeks[wk][ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);});});
  const wks=Object.keys(muscleWeeks).sort().slice(-4);
  const allMuscles=[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.muscle)))];
  const muscleData=wks.map(wk=>({week:wk,...Object.fromEntries(allMuscles.map(m=>[m,dw(muscleWeeks[wk]?.[m]||0)]))}));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><UnitToggle unit={unit} onChange={setUnit}/></div>
      <div style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div style={S.label}>1RM estimé ({unit})</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input value={exSearch} onChange={e=>{setExSearch(e.target.value);setExFilter("all");}} placeholder="🔍 Filtrer exercice…" style={{...S.input,width:200,fontSize:13}}/>
            <select value={exFilter} onChange={e=>setExFilter(e.target.value)} style={{...S.select,width:"auto"}}>
              <option value="all">Tous</option>
              {filteredNames.map(n=><option key={n}>{n}</option>)}
            </select>
          </div>
        </div>
        <ResponsiveContainer width="100%" height={240}>
          <LineChart data={lineData}><CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a"/><XAxis dataKey="date" tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><Tooltip {...TT} formatter={v=>[`${v} ${unit}`]}/><Legend wrapperStyle={{fontSize:11,color:"#5a5a5a"}}/>{Object.keys(byEx).slice(0,6).map((n,i)=><Line key={n} type="monotone" dataKey={n} stroke={COLORS[i%COLORS.length]} strokeWidth={2} dot={{r:4}} connectNulls/>)}</LineChart>
        </ResponsiveContainer>
      </div>
      <div style={S.card}>
        <div style={S.label}>Volume par muscle — 4 dernières semaines ({unit})</div>
        <ResponsiveContainer width="100%" height={200}><BarChart data={muscleData} barCategoryGap="25%"><CartesianGrid strokeDasharray="3 3" stroke="#2a2a2a"/><XAxis dataKey="week" tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#5a5a5a",fontSize:11}} axisLine={false} tickLine={false}/><Tooltip {...TT}/><Legend wrapperStyle={{fontSize:11,color:"#5a5a5a"}}/>{allMuscles.map((m,i)=><Bar key={m} dataKey={m} fill={COLORS[i%COLORS.length]} radius={[3,3,0,0]} stackId="a"/>)}</BarChart></ResponsiveContainer>
      </div>
      <div style={S.card}>
        <div style={S.label}>Personal Records</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:8,marginTop:8}}>
          {Object.entries(prs).map(([name,pr])=>(<div key={name} style={{background:"#181818",borderRadius:8,padding:"10px 12px",border:"1px solid #2a2a2a"}}><div style={{fontSize:12,fontWeight:600,color:"#f0f0f0",marginBottom:4}}>{name}</div><div style={{fontSize:20,fontWeight:700,color:"#c8f135",fontFamily:"'DM Mono',monospace"}}>{dw(pr.orm)}<span style={{fontSize:12,color:"#5a5a5a"}}>{unit}</span></div><div style={{fontSize:11,color:"#5a5a5a",marginTop:2}}>{dw(pr.weight)}{unit} × {pr.reps} · {pr.date}</div></div>))}
        </div>
      </div>
    </div>
  );
}

const TABS=[{id:"dashboard",label:"Dashboard"},{id:"log",label:"Log séance"},{id:"programs",label:"Programmes"},{id:"progress",label:"Progression"},{id:"history",label:"Historique"}];

async function fetchSupabaseWorkouts(){
  try{
    const rows=await sbFetch("daily_logs?select=date,data&order=date.desc&limit=300");
    const workouts=[];
    rows.forEach(row=>{if(row.data){const imp=importDailyLog(row.data,row.date);if(imp)workouts.push(imp);}});
    return workouts;
  }catch(e){console.error("Supabase:",e);return[];}
}

async function saveWorkoutToSupabase(workout){
  try{
    const existing=await sbFetch(`daily_logs?date=eq.${workout.date}&select=*`);
    const exercises=workout.exercises.map(ex=>({id:Date.now()+Math.random(),name:ex.name,muscle:ex.muscle,unit:"lbs",sets:ex.sets.map(s=>({reps:String(s.r),weight:String(Math.round(dispW(s.w,"lb")*10)/10)})),isCustom:false}));
    if(existing&&existing[0]){
      const newData={...existing[0].data,exercises:[...(existing[0].data.exercises||[]),...exercises]};
      await sbFetch(`daily_logs?id=eq.${existing[0].id}`,{method:"PATCH",body:JSON.stringify({data:newData}),prefer:"return=minimal"});
    }
  }catch(e){console.error("Supabase save:",e);}
}

        </div>
        <span style={{fontSize:12,color:"#5a5a5a",fontFamily:"'DM Mono',monospace"}}>
          {new Intl.DateTimeFormat("fr-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
        </span>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid #262626",background:"#121212",overflowX:"auto"}}>
        {TABS.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",cursor:"pointer",padding:"12px 18px",fontSize:13,fontWeight:tab===t.id?600:400,color:tab===t.id?"#c8f135":"#5a5a5a",borderBottom:tab===t.id?"2px solid #c8f135":"2px solid transparent",whiteSpace:"nowrap",transition:"all 0.15s"}}>{t.label}</button>))}
      </div>
      {loading?(
        <div style={{padding:"60px 24px",textAlign:"center",color:"#5a5a5a",fontSize:13}}>
          <div style={{fontSize:28,marginBottom:12,display:"inline-block",animation:"spin 1s linear infinite"}}>⟳</div>
          <div>Chargement depuis Supabase…</div>
        </div>
      ):(
        <div style={{padding:"20px 24px",maxWidth:1100,margin:"0 auto"}}>
          {tab==="dashboard"&&<Dashboard workouts={workouts} unit={unit} setUnit={setUnit}/>}
          {tab==="log"&&<LogWorkout onSave={handleSave} workouts={workouts} programs={programs} unit={unit} setUnit={setUnit} allExercises={allExercises}/>}
          {tab==="programs"&&<ProgramsPage programs={programs} setPrograms={setPrograms} allExercises={allExercises}/>}
          {tab==="progress"&&<Progress workouts={workouts} unit={unit} setUnit={setUnit}/>}
          {tab==="history"&&<History workouts={workouts} unit={unit}/>}
        </div>
      )}
      {toast&&(<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#c8f135",color:"#0a0a0a",padding:"10px 22px",borderRadius:20,fontSize:13,fontWeight:600,zIndex:999}}>{toast}</div>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
