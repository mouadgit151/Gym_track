// ─── Timezone ─────────────────────────────────────────────────────────────────
const TZ="America/Toronto";
function todayMTL(){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getMondayMTL(ds){const d=new Date(ds+"T12:00:00"),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d.toISOString().slice(0,10);}
function getWeekKey(ds){const d=new Date(ds+"T12:00:00"),j=new Date(d.getFullYear(),0,1),wk=Math.ceil(((d-j)/86400000+j.getDay()+1)/7);return`${d.getFullYear()}-W${String(wk).padStart(2,"0")}`;}
function getCurrentWeekWorkouts(wos){const mon=getMondayMTL(todayMTL()),sun=new Date(mon+"T00:00:00");sun.setDate(sun.getDate()+6);const s=sun.toISOString().slice(0,10);return wos.filter(w=>w.date>=mon&&w.date<=s);}

// ─── Units ────────────────────────────────────────────────────────────────────
const KL=2.20462,LK=0.453592;
function toLb(kg){return Math.round(kg*KL*4)/4;}
function toKg(lb){return Math.round(lb*LK*4)/4;}
function dispW(kg,u){return u==="lb"?toLb(kg):Math.round(kg*10)/10;}
function storeW(v,u){return u==="lb"?toKg(parseFloat(v)||0):parseFloat(v)||0;}
function calc1RM(w,r){return r===0?0:Math.round(w*(1+r/30));}
function calcVol(wo){return wo.exercises.reduce((t,ex)=>t+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0),0);}

// ─── Import from Supabase format ──────────────────────────────────────────────
function importLog(data,date){
  if(!data||!Array.isArray(data.exercises)) return null;
  const exercises=data.exercises.filter(ex=>ex.name&&Array.isArray(ex.sets)&&ex.sets.length>0).map(ex=>{
    const su=(ex.unit||"lbs").toLowerCase().includes("lb")?"lb":"kg";
    const sets=ex.sets.filter(s=>s.weight!==""&&s.reps!=="").map(s=>({w:su==="lb"?toKg(parseFloat(s.weight)||0):parseFloat(s.weight)||0,r:parseInt(s.reps)||0,type:"normal"})).filter(s=>s.r>0);
    if(!sets.length) return null;
    return{name:ex.name,muscle:ex.muscle||"",splitSides:false,sets};
  }).filter(Boolean);
  if(!exercises.length) return null;
  return{id:"imp_"+date,date,type:"Workout",exercises};
}

// ─── SVG Charts ───────────────────────────────────────────────────────────────
function BarSVG({data,xKey,yKey,color,height=160,unit=""}){
  if(!data||data.length===0) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.mu,fontSize:12}}>Pas encore de données</div>;
  const max=Math.max(...data.map(d=>d[yKey]||0),1);
  const W=500,H=height,PL=40,PB=28,PT=10,PR=10;
  const bw=Math.max(4,((W-PL-PR)/data.length)*0.6);
  const x=i=>PL+i*(W-PL-PR)/Math.max(data.length-1,1)-(data.length>1?0:0);
  const barX=i=>PL+(i+0.5)*(W-PL-PR)/data.length-bw/2;
  const y=v=>H-PB-((v/max)*(H-PT-PB));
  const gridVals=[0,Math.round(max/2),max];
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{overflow:"visible"}}>
      {gridVals.map((v,i)=>(
        <g key={i}>
          <line x1={PL} y1={y(v)} x2={W-PR} y2={y(v)} stroke={C.b2} strokeWidth="1"/>
          <text x={PL-5} y={y(v)+4} textAnchor="end" fontSize="9" fill={C.mu}>{v>999?`${(v/1000).toFixed(1)}k`:v}</text>
        </g>
      ))}
      {data.map((d,i)=>{
        const val=d[yKey]||0;
        const bh=Math.max(val>0?3:0,(val/max)*(H-PT-PB));
        return(
          <g key={i}>
            <rect x={barX(i)} y={H-PB-bh} width={bw} height={bh} fill={color||C.ac} rx="3"/>
            <text x={barX(i)+bw/2} y={H-4} textAnchor="middle" fontSize="9" fill={C.mu}>{d[xKey]}</text>
          </g>
        );
      })}
    </svg>
  );
}

function GroupedBarSVG({data,keys,colors,height=160,unit=""}){
  if(!data||data.length===0) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.mu,fontSize:12}}>Pas encore de données</div>;
  const allVals=data.flatMap(d=>keys.map(k=>d[k]||0));
  const max=Math.max(...allVals,1);
  const W=500,H=height,PL=40,PB=28,PT=10,PR=10;
  const slotW=(W-PL-PR)/data.length;
  const bw=Math.min(20,slotW/keys.length*0.8);
  const y=v=>H-PB-((v/max)*(H-PT-PB));
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{overflow:"visible"}}>
      {[0,Math.round(max/2),max].map((v,i)=>(
        <g key={i}>
          <line x1={PL} y1={y(v)} x2={W-PR} y2={y(v)} stroke={C.b2} strokeWidth="1"/>
          <text x={PL-5} y={y(v)+4} textAnchor="end" fontSize="9" fill={C.mu}>{v>999?`${(v/1000).toFixed(1)}k`:v}</text>
        </g>
      ))}
      {data.map((d,i)=>{
        const cx=PL+(i+0.5)*slotW;
        const totalBW=keys.length*bw+(keys.length-1)*2;
        return(
          <g key={i}>
            {keys.map((k,j)=>{
              const val=d[k]||0;
              const bh=Math.max(val>0?2:0,(val/max)*(H-PT-PB));
              const bx=cx-totalBW/2+j*(bw+2);
              return <rect key={k} x={bx} y={H-PB-bh} width={bw} height={bh} fill={colors[j]||C.ac} rx="2"/>;
            })}
            <text x={cx} y={H-4} textAnchor="middle" fontSize="9" fill={C.mu}>{d.muscle||d.week}</text>
          </g>
        );
      })}
      <g transform={`translate(${PL},${H-4})`}>
        {keys.slice(0,4).map((k,i)=>(
          <g key={k} transform={`translate(${i*80},0)`}>
            <rect x="0" y="-7" width="8" height="8" fill={colors[i]||C.ac} rx="1"/>
            <text x="10" y="0" fontSize="8" fill={C.mu}>{k}</text>
          </g>
        ))}
      </g>
    </svg>
  );
}

function LineSVG({data,series,colors,height=200,unit=""}){
  if(!data||data.length<2) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.mu,fontSize:12}}>Besoin d'au moins 2 séances</div>;
  const allVals=series.flatMap(s=>data.map(d=>d[s]||0)).filter(v=>v>0);
  if(!allVals.length) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.mu,fontSize:12}}>Pas encore de données</div>;
  const max=Math.max(...allVals,1),min=Math.max(0,Math.min(...allVals)-10);
  const W=500,H=height,PL=40,PB=28,PT=10,PR=10;
  const xs=i=>PL+i*(W-PL-PR)/Math.max(data.length-1,1);
  const ys=v=>H-PB-((v-min)/(max-min||1))*(H-PT-PB);
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{overflow:"visible"}}>
      <defs>
        {series.map((s,i)=>(
          <linearGradient key={s} id={`lg${i}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={colors[i]||C.ac} stopOpacity="0.2"/>
            <stop offset="100%" stopColor={colors[i]||C.ac} stopOpacity="0"/>
          </linearGradient>
        ))}
      </defs>
      {[min,Math.round((min+max)/2),max].map((v,i)=>(
        <g key={i}>
          <line x1={PL} y1={ys(v)} x2={W-PR} y2={ys(v)} stroke={C.b2} strokeWidth="1"/>
          <text x={PL-5} y={ys(v)+4} textAnchor="end" fontSize="9" fill={C.mu}>{v.toFixed(0)}</text>
        </g>
      ))}
      {series.map((s,si)=>{
        const pts=data.filter(d=>d[s]!=null);
        if(pts.length<2) return null;
        const pathData=pts.map((d,i)=>{const idx=data.indexOf(d);return`${i===0?"M":"L"}${xs(idx)},${ys(d[s])}`;}).join(" ");
        const areaData=pts.map((d,i)=>{const idx=data.indexOf(d);return`${i===0?"M":"L"}${xs(idx)},${ys(d[s])}`;}).join(" ")+` L${xs(data.indexOf(pts[pts.length-1]))},${H-PB} L${xs(data.indexOf(pts[0]))},${H-PB} Z`;
        return(
          <g key={s}>
            <path d={areaData} fill={`url(#lg${si})`}/>
            <path d={pathData} fill="none" stroke={colors[si]||C.ac} strokeWidth="2.5" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 4px ${colors[si]||C.ac}88)`}}/>
            {pts.map((d,i)=>{const idx=data.indexOf(d);return <circle key={i} cx={xs(idx)} cy={ys(d[s])} r="4" fill={colors[si]||C.ac}/>;} )}
          </g>
        );
      })}
      {data.map((d,i)=>(
        i%Math.max(1,Math.floor(data.length/6))===0&&<text key={i} x={xs(i)} y={H-6} textAnchor="middle" fontSize="8" fill={C.mu}>{d.date}</text>
      ))}

            <text x="15" y="4" fontSize="8" fill={C.mu}>{s}</text>
          </g>
        ))}

}

function RadarSVG({data,height=220}){
  if(!data||data.length===0) return null;
  const max=Math.max(...data.map(d=>d.volume||0),1);
  const cx=200,cy=110,r=90;
  const n=data.length;
  const angle=i=>i*2*Math.PI/n-Math.PI/2;
  const px=(i,rr)=>cx+rr*Math.cos(angle(i));
  const py=(i,rr)=>cy+rr*Math.sin(angle(i));
  const gridPts=pct=>data.map((_,i)=>`${px(i,r*pct)},${py(i,r*pct)}`).join(" ");
  const valuePts=data.map((d,i)=>{const rr=r*(d.volume||0)/max;return`${px(i,rr)},${py(i,rr)}`;}).join(" ");
  return(
    <svg viewBox="0 0 400 220" width="100%">
      {[0.25,0.5,0.75,1].map(p=><polygon key={p} points={gridPts(p)} fill="none" stroke={C.b2} strokeWidth="1"/>)}
      {data.map((_,i)=><line key={i} x1={cx} y1={cy} x2={px(i,r)} y2={py(i,r)} stroke={C.b2} strokeWidth="1"/>)}
      <polygon points={valuePts} fill={C.ac+"22"} stroke={C.ac} strokeWidth="2" style={{filter:`drop-shadow(0 0 6px ${C.ac}66)`}}/>
      {data.map((d,i)=>(
        <text key={i} x={px(i,r+16)} y={py(i,r+16)+4} textAnchor="middle" fontSize="9" fill={C.mu}>{d.muscle}</text>
      ))}
    </svg>
  );
}

// ─── Timer ────────────────────────────────────────────────────────────────────
const TK="gymtracker_timer_v1";
function tSave(e,t){try{localStorage.setItem(TK,JSON.stringify({endTs:e,total:t}));}catch{}}
function tClear(){try{localStorage.removeItem(TK);}catch{}}
function tLoad(){try{const r=localStorage.getItem(TK);return r?JSON.parse(r):null;}catch{return null;}}
function tRem(s){return s?Math.max(0,Math.ceil((s.endTs-Date.now())/1000)):0;}

function RestTimer(){
  const saved=tLoad(),initRem=tRem(saved);
  const[running,setRunning]=useState(!!(saved&&initRem>0));
  const[secs,setSecs]=useState(saved&&initRem>0?initRem:(saved?.total??120));
  const[def,setDef]=useState(saved?.total??120);
  const[done,setDone]=useState(!!(saved&&initRem===0&&saved.endTs));
  const[showC,setShowC]=useState(false);
  const[cm,setCm]=useState(""),[ cs,setCs]=useState("");
  const iv=useRef(null);
  const tick=useCallback(()=>{const s=tLoad();if(!s){clearInterval(iv.current);return;}const rem=tRem(s);setSecs(rem);if(rem<=0){clearInterval(iv.current);tClear();setRunning(false);setDone(true);}},[]);
  useEffect(()=>{
    if(running) iv.current=setInterval(tick,500);
    else clearInterval(iv.current);
    const onVis=()=>{if(document.visibilityState==="visible")tick();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(iv.current);document.removeEventListener("visibilitychange",onVis);};
  },[running,tick]);
  function start(s){clearInterval(iv.current);tSave(Date.now()+s*1000,s);setDef(s);setSecs(s);setRunning(true);setDone(false);iv.current=setInterval(tick,500);}
  function stop(){clearInterval(iv.current);tClear();setRunning(false);setDone(false);setSecs(def);}
  function applyC(){const s=(+cm||0)*60+(+cs||0);if(s>0){start(s);setShowC(false);}}
  const m=Math.floor(secs/60),s2=secs%60,pct=secs/def,circ=2*Math.PI*38;
  const col=done?C.ac:running?C.bl:C.mu;
  return(
    <div style={{background:C.s2,borderRadius:10,padding:"12px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
      <div style={{position:"relative",width:52,height:52,flexShrink:0}}>
        <svg width="52" height="52" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="38" fill="none" stroke={C.b2} strokeWidth={5}/>
          <circle cx="40" cy="40" r="38" fill="none" stroke={col} strokeWidth={5} strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" transform="rotate(-90 40 40)" style={{transition:"stroke-dashoffset 1s linear,stroke 0.3s"}}/>
          <text x="50%" y="58%" textAnchor="middle" fill={col} style={{fontSize:18,fontWeight:700,fontFamily:"monospace"}}>{String(m).padStart(2,"0")}:{String(s2).padStart(2,"0")}</text>
        </svg>
      </div>
      <div style={{flex:1}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:7}}>
          {[["1m",60],["1m30",90],["2m",120],["3m",180]].map(([l,v])=><button key={v} onClick={()=>start(v)} style={{...S.btnS(def===v&&running),padding:"4px 10px",fontSize:11}}>{l}</button>)}
          <button onClick={()=>setShowC(x=>!x)} style={{...S.btnS(false),padding:"4px 10px",fontSize:11}}>Custom</button>
        </div>
        {showC&&<div style={{display:"flex",gap:5,marginBottom:7,alignItems:"center"}}><input type="number" placeholder="min" value={cm} onChange={e=>setCm(e.target.value)} style={{...S.inp,width:52,textAlign:"center",padding:"4px"}}/><span style={{color:C.mu}}>:</span><input type="number" placeholder="sec" value={cs} onChange={e=>setCs(e.target.value)} style={{...S.inp,width:52,textAlign:"center",padding:"4px"}}/><button onClick={applyC} style={{...S.btnP,padding:"5px 10px",fontSize:12}}>OK</button></div>}
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          {running&&<button onClick={stop} style={{...S.btnG,padding:"5px 12px",fontSize:12,color:C.rd,borderColor:C.rd}}>■ Stop</button>}
          {done&&<button onClick={()=>{setDone(false);setSecs(def);}} style={{...S.btnP,padding:"5px 12px",fontSize:12}}>↺ Reset</button>}
          {!running&&!done&&<span style={{fontSize:11,color:C.mu}}>⏱ Sélectionne une durée</span>}
          {done&&<span style={{fontSize:13,fontWeight:700,color:C.ac}}>🔔 Go ! 💪</span>}
        </div>
      </div>
    </div>
  );
}

// ─── ExSearch ─────────────────────────────────────────────────────────────────
function ExSearch({value,onChange,onSelect}){
  const[open,setOpen]=useState(false);
  const[q,setQ]=useState(value||"");
  const ref=useRef();
  useEffect(()=>{setQ(value||"");},[value]);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
  const res=useMemo(()=>{if(!q.trim())return EX.slice(0,10);const ql=q.toLowerCase();return[...EX.filter(e=>e.muscle.toLowerCase().includes(ql)),...EX.filter(e=>e.name.toLowerCase().includes(ql)&&!e.muscle.toLowerCase().includes(ql))].slice(0,20);},[q]);
  return(
    <div ref={ref} style={{position:"relative",flex:1}}>
      <input style={S.inp} value={q} onChange={e=>{setQ(e.target.value);onChange(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} placeholder="Muscle ou exercice…"/>
      {open&&res.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:200,background:C.s1,border:`1px solid ${C.b1}`,borderRadius:8,maxHeight:200,overflowY:"auto",marginTop:4,boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
          {res.map(ex=><div key={ex.name} onMouseDown={()=>{onSelect(ex);setQ(ex.name);setOpen(false);}} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",cursor:"pointer",borderBottom:`1px solid ${C.b2}`}} onMouseEnter={e=>e.currentTarget.style.background=C.s2} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><span style={{fontSize:13,color:C.tx}}>{ex.name}</span><span style={{fontSize:11,color:C.mu}}>{ex.muscle}</span></div>)}
        </div>
      )}
    </div>
  );
}

// ─── ExHistory ────────────────────────────────────────────────────────────────
function ExHistory({exName,workouts,unit,currentId}){
  const[open,setOpen]=useState(false);
  if(!exName) return null;
  let pr={w:0,r:0,orm:0,date:""};
  workouts.forEach(wo=>{if(wo.id===currentId)return;wo.exercises.forEach(ex=>{if(ex.name!==exName)return;ex.sets.forEach(s=>{const o=calc1RM(s.w,s.r);if(o>pr.orm)pr={w:s.w,r:s.r,orm:o,date:wo.date};});});});
  const lastWo=[...workouts].filter(wo=>wo.id!==currentId&&wo.exercises.some(e=>e.name===exName)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastEx=lastWo?.exercises.find(e=>e.name===exName);
  const dw=kg=>Math.round(dispW(kg,unit)*10)/10;
  if(!pr.orm&&!lastEx) return null;
  return(
    <div style={{marginBottom:8}}>
      <button onClick={()=>setOpen(o=>!o)} style={{...S.btnG,fontSize:11,padding:"4px 10px",display:"flex",alignItems:"center",gap:6}}>
        📊
        {pr.orm>0&&<span style={{color:C.ac}}>PR: {dw(pr.w)}{unit}×{pr.r} (~{dw(calc1RM(pr.w,pr.r))}{unit})</span>}
        {lastEx&&<span style={{color:C.mu}}>· {lastWo.date}</span>}
        <span style={{color:C.mu}}>{open?"▲":"▼"}</span>
      </button>
      {open&&<div style={{background:C.s2,borderRadius:8,padding:"10px 12px",marginTop:6,fontSize:12}}>
        {pr.orm>0&&<div style={{marginBottom:8}}><span style={{color:C.ac,fontWeight:600}}>🏆 PR — </span><span style={{color:C.tx}}>{dw(pr.w)}{unit}×{pr.r} · {pr.date}</span><span style={{color:C.mu,marginLeft:8}}>~{dw(calc1RM(pr.w,pr.r))}{unit}</span></div>}
        {lastEx&&<div><div style={{color:C.mu,marginBottom:4,fontWeight:600}}>Dernière — {lastWo.date}</div>{lastEx.sets.map((s,i)=><div key={i} style={{color:C.tx,padding:"2px 0"}}><span style={{color:C.mu}}>S{i+1}</span> {dw(s.w)}{unit}×{s.r} reps {lastEx.splitSides&&s.wL!=null&&<span style={{color:C.mu}}>(G:{dw(s.wL)}{unit}×{s.rL})</span>} <span style={{color:C.acd}}>~{dw(calc1RM(s.w,s.r))}{unit}</span></div>)}</div>}
      </div>}
    </div>
  );
}

// ─── ExBlock ──────────────────────────────────────────────────────────────────
function ExBlock({ex,onChange,onRemove,workouts,unit,currentId}){
  const add=()=>{const l=ex.sets.slice(-1)[0]||{w:0,r:8,type:"normal"};onChange({...ex,sets:[...ex.sets,{...l,type:"normal"}]});};
  const upd=(si,s)=>onChange({...ex,sets:ex.sets.map((x,i)=>i===si?s:x)});

  return(
    <div style={{...S.card,borderLeft:`3px solid ${C.ac}`,marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>

        <button onClick={onRemove} style={{background:"none",border:"none",cursor:"pointer",color:C.mu,fontSize:18}}>×</button>

    </div>
  );
}

// ─── WeeklyMap ────────────────────────────────────────────────────────────────
function WeeklyMap({workouts,unit}){
  const[hov,setHov]=useState(null);
  const mon=getMondayMTL(todayMTL()),sun=new Date(mon+"T00:00:00");sun.setDate(sun.getDate()+6);
  const wkWos=getCurrentWeekWorkouts(workouts);
  const wkVol={};wkWos.forEach(w=>w.exercises.forEach(ex=>{const v=ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);wkVol[ex.muscle]=(wkVol[ex.muscle]||0)+v;}));
  const maxV=Math.max(...Object.values(wkVol),1);
  const mi={};Object.entries(wkVol).forEach(([m,v])=>{mi[m]=v/maxV;});
  const fmt=d=>d.toLocaleDateString("fr-CA",{month:"short",day:"numeric"});
  const dw=kg=>Math.round(dispW(kg,unit));
  return(
    <div style={{...S.card,height:"100%"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={S.lbl}>Muscles cette semaine</div>
        <span style={{fontSize:11,color:C.mu,background:C.s2,padding:"3px 8px",borderRadius:4}}>{fmt(new Date(mon+"T12:00:00"))} – {fmt(sun)}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:14,alignItems:"start"}}>
        <BodyMap mi={mi} hov={hov} onHov={setHov}/>
        <div>
          {hov&&wkVol[hov]&&<div style={{background:C.s2,borderRadius:8,padding:"8px 12px",marginBottom:10,border:`1px solid ${C.ac}40`}}><div style={{fontSize:13,fontWeight:600,color:C.ac}}>{hov}</div><div style={{fontSize:12,color:C.mu,marginTop:2}}>{dw(wkVol[hov]).toLocaleString()} {unit}</div></div>}
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {ALL_MUSCLES.map(m=>{
              const vol=wkVol[m]||0,pct=vol/maxV,done=vol>0;
              return(<div key={m} onMouseEnter={()=>setHov(m)} onMouseLeave={()=>setHov(null)} style={{cursor:"pointer",opacity:hov&&hov!==m?0.45:1,transition:"opacity 0.15s"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:11,color:done?C.tx:C.mu,fontWeight:done?500:400}}>{m}</span>
                  <span style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:done?C.ac:C.b2}}>{done?`${dw(vol).toLocaleString()} ${unit}`:"—"}</span>
                </div>
                <div style={{height:3,background:C.b2,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${pct*100}%`,borderRadius:2,background:done?muscleFill(pct):"transparent",transition:"width 0.4s"}}/></div>
              </div>);
            })}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center",marginTop:12}}>
            <span style={{fontSize:10,color:C.mu}}>Intensité :</span>
            {["#1a3a10","#2d6b18","#5aa62a","#c8f135"].map((c,i)=><div key={i} style={{width:11,height:11,borderRadius:2,background:c}}/>)}
            <span style={{fontSize:10,color:C.mu}}>max</span>
          </div>
          <div style={{fontSize:10,color:C.b2,marginTop:5}}>↺ Reset lundi (Montréal)</div>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({workouts,unit,setUnit}){
  const weeks={};
  workouts.forEach(w=>{const k=getWeekKey(w.date);if(!weeks[k])weeks[k]={key:k,vol:0,sets:0,workouts:0,muscles:{}};weeks[k].vol+=calcVol(w);weeks[k].workouts++;w.exercises.forEach(ex=>{weeks[k].sets+=ex.sets.length;weeks[k].muscles[ex.muscle]=(weeks[k].muscles[ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);});});
  const wArr=Object.values(weeks).sort((a,b)=>a.key.localeCompare(b.key));
  const cur=wArr[wArr.length-1]||{vol:0,sets:0,workouts:0,muscles:{}};
  const prev=wArr[wArr.length-2]||{vol:0,sets:0,workouts:0,muscles:{}};
  const volD=prev.vol>0?Math.round((cur.vol-prev.vol)/prev.vol*100):0;
  const setsD=prev.sets>0?Math.round((cur.sets-prev.sets)/prev.sets*100):0;
  const dw=kg=>Math.round(dispW(kg,unit));
  const volData=wArr.map(w=>({week:w.key.replace(/\d{4}-/,""),vol:dw(w.vol)}));
  const muscleTot={};workouts.forEach(w=>w.exercises.forEach(ex=>{muscleTot[ex.muscle]=(muscleTot[ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);}));
  const radarData=Object.entries(muscleTot).map(([m,v])=>({muscle:m.substring(0,3),volume:Math.round(dw(v)/100)}));
  const cmpData=Object.keys(cur.muscles||{}).map(m=>({muscle:m.substring(0,4),current:dw(cur.muscles[m]||0),previous:dw(prev.muscles?.[m]||0)}));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <div style={{display:"flex",gap:4}}>{["lb","kg"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{...S.btnS(unit===u),padding:"3px 10px",fontSize:12}}>{u}</button>)}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>
        {[{label:"Volume / semaine",val:`${Math.round(dw(cur.vol)/1000*10)/10}t`,delta:volD},{label:"Séances",val:cur.workouts,delta:null},{label:"Sets",val:cur.sets,delta:setsD},{label:"Exercices",val:new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name))).size,delta:null}].map((kpi,i)=>(
          <div key={i} style={S.card}><div style={S.lbl}>{kpi.label}</div><div style={S.val}>{kpi.val}</div>{kpi.delta!==null&&<div style={{fontSize:12,color:kpi.delta>=0?C.ac:C.rd,marginTop:3}}>{kpi.delta>=0?"▲":"▼"} {Math.abs(kpi.delta)}% vs S-1</div>}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:14}}>
        <WeeklyMap workouts={workouts} unit={unit}/>
        <div style={S.card}><div style={S.lbl}>Radar musculaire</div><RadarSVG data={radarData} height={300}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={S.card}><div style={S.lbl}>Volume par semaine ({unit})</div><BarSVG data={volData} xKey="week" yKey="vol" color={C.ac} unit={unit}/></div>
        <div style={S.card}>
          <div style={S.lbl}>S actuelle vs S-1 ({unit})</div>
          <GroupedBarSVG data={cmpData} keys={["previous","current"]} colors={[C.b2,C.ac]} unit={unit}/>
        </div>
      </div>
    </div>
  );
}

// ─── Log ──────────────────────────────────────────────────────────────────────
function LogWorkout({onSave,workouts,programs,unit,setUnit}){
  const[type,setType]=useState("Push");
  const[date,setDate]=useState(todayMTL());
  const[exercises,setExercises]=useState([]);
  const[showTimer,setShowTimer]=useState(false);
  const wid=useRef("new_"+Date.now());
  const loadProg=useCallback((name)=>{
    const prog=programs.find(p=>p.name===name);
    if(!prog){setExercises([]);return;}
    const exs=prog.exercises.map(n=>{const f=EX.find(e=>e.name===n)||{name:n,muscle:""};return{name:f.name,muscle:f.muscle,splitSides:false,sets:[{w:0,r:8,type:"normal"}]};});
    setExercises(exs.length>0?exs:[{name:"",muscle:"",splitSides:false,sets:[{w:0,r:8,type:"normal"}]}]);
  },[programs]);
  useEffect(()=>{loadProg(type);},[type]);
  const addEx=()=>setExercises(e=>[...e,{name:"",muscle:"",splitSides:false,sets:[{w:0,r:8,type:"normal"}]}]);
  const remEx=i=>exercises.length>1&&setExercises(e=>e.filter((_,j)=>j!==i));
  const updEx=(i,ex)=>setExercises(e=>e.map((x,j)=>j===i?ex:x));
  return(
    <div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <select value={type} onChange={e=>setType(e.target.value)} style={{...S.sel,flex:1,minWidth:160}}>{programs.map(p=><option key={p.id}>{p.name}</option>)}</select>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...S.inp,width:"auto"}}/>
        <div style={{display:"flex",gap:4}}>{["lb","kg"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{...S.btnS(unit===u),padding:"3px 10px",fontSize:12}}>{u}</button>)}</div>
        <button onClick={()=>setShowTimer(x=>!x)} style={{...S.btnS(showTimer,C.bl),padding:"7px 12px",fontSize:12}}>⏱ Chrono</button>
      </div>
      {showTimer&&<RestTimer/>}
      {exercises.map((ex,i)=><ExBlock key={i} ex={ex} workouts={workouts} currentId={wid.current} unit={unit} onChange={ex=>updEx(i,ex)} onRemove={()=>remEx(i)}/>)}
      <div style={{display:"flex",gap:10,marginTop:4}}>
        <button onClick={addEx} style={S.btnG}>+ Exercice</button>
        <button onClick={()=>{const v=exercises.filter(ex=>ex.name&&ex.sets.some(s=>s.r>0));if(!v.length)return;onSave({id:wid.current,date,type,exercises:v});wid.current="new_"+Date.now();}} style={S.btnP}>Sauvegarder séance</button>
      </div>
    </div>
  );
}

// ─── Programs ─────────────────────────────────────────────────────────────────
function Programs({programs,setPrograms}){
  const[sel,setSel]=useState(programs[0]?.id||null);
  const[editName,setEditName]=useState("");
  const[exSearch,setExSearch]=useState("");
  const[creating,setCreating]=useState(false);
  const[newName,setNewName]=useState("");
  const prog=programs.find(p=>p.id===sel);
  useEffect(()=>{if(prog)setEditName(prog.name);},[sel]);
  const save=()=>setPrograms(prev=>prev.map(p=>p.id===sel?{...p,name:editName}:p));
  const del=()=>{setPrograms(prev=>prev.filter(p=>p.id!==sel));setSel(programs[0]?.id||null);};
  const addEx=ex=>{if(!prog||prog.exercises.includes(ex.name))return;setPrograms(prev=>prev.map(p=>p.id===sel?{...p,exercises:[...p.exercises,ex.name]}:p));};
  const remEx=name=>setPrograms(prev=>prev.map(p=>p.id===sel?{...p,exercises:p.exercises.filter(e=>e!==name)}:p));
  const createNew=()=>{if(!newName.trim())return;const id="prog_"+Date.now();setPrograms(prev=>[...prev,{id,name:newName.trim(),exercises:[]}]);setSel(id);setCreating(false);setNewName("");};
  const filteredEx=useMemo(()=>{if(!exSearch.trim())return EX.slice(0,20);const q=exSearch.toLowerCase();return[...EX.filter(e=>e.muscle.toLowerCase().includes(q)),...EX.filter(e=>e.name.toLowerCase().includes(q)&&!e.muscle.toLowerCase().includes(q))].slice(0,25);},[exSearch]);
  return(
    <div style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:14}}>
      <div style={S.card}>
        <div style={S.lbl}>Mes programmes</div>
        {programs.map(p=><div key={p.id} onClick={()=>setSel(p.id)} style={{padding:"8px 10px",borderRadius:8,cursor:"pointer",marginBottom:4,background:sel===p.id?C.ac+"22":C.s2,color:sel===p.id?C.ac:C.tx,fontSize:13,fontWeight:sel===p.id?600:400}}>{p.name} <span style={{fontSize:11,color:C.mu}}>{p.exercises.length}</span></div>)}
        {creating?<div style={{marginTop:8}}><input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nom…" style={{...S.inp,marginBottom:6}}/><div style={{display:"flex",gap:6}}><button onClick={createNew} style={{...S.btnP,padding:"5px 12px",fontSize:12}}>Créer</button><button onClick={()=>setCreating(false)} style={{...S.btnG,padding:"5px 10px",fontSize:12}}>✕</button></div></div>
        :<button onClick={()=>setCreating(true)} style={{...S.btnG,width:"100%",marginTop:8,fontSize:12}}>+ Nouveau</button>}
      </div>
      {prog?<div>
        <div style={S.card}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}><input value={editName} onChange={e=>setEditName(e.target.value)} style={{...S.inp,flex:1}}/><button onClick={save} style={{...S.btnP,padding:"7px 14px",fontSize:12}}>Sauvegarder</button><button onClick={del} style={{...S.btnG,padding:"7px 12px",fontSize:12,color:C.rd,borderColor:C.rd}}>Supprimer</button></div>
          <div style={S.lbl}>Exercices ({prog.exercises.length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>{prog.exercises.map(name=><span key={name} style={{background:C.s2,border:`1px solid ${C.b1}`,borderRadius:6,padding:"4px 10px",fontSize:12,color:C.tx,display:"flex",alignItems:"center",gap:6}}>{name}<button onClick={()=>remEx(name)} style={{background:"none",border:"none",cursor:"pointer",color:C.mu,fontSize:13,padding:0}}>×</button></span>)}</div>
        </div>
        <div style={S.card}>
          <div style={S.lbl}>Ajouter des exercices</div>
          <input value={exSearch} onChange={e=>setExSearch(e.target.value)} placeholder="Chercher par muscle ou nom…" style={{...S.inp,marginBottom:10}}/>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{filteredEx.map(ex=>{const a=prog.exercises.includes(ex.name);return<button key={ex.name} onClick={()=>addEx(ex)} disabled={a} style={{background:a?C.acd+"22":C.s2,color:a?C.acd:C.tx,border:`1px solid ${a?C.acd:C.b1}`,borderRadius:6,padding:"5px 10px",fontSize:12,cursor:a?"default":"pointer"}}>{ex.name} <span style={{color:C.mu,fontSize:10}}>{ex.muscle}</span>{a&&" ✓"}</button>;})}</div>
        </div>
      </div>:<div style={{...S.card,display:"flex",alignItems:"center",justifyContent:"center",color:C.mu,fontSize:13}}>Sélectionne ou crée un programme</div>}
    </div>
  );
}

// ─── Progression ──────────────────────────────────────────────────────────────
function Progression({workouts,unit,setUnit}){
  const[exFilter,setExFilter]=useState("all");
  const[exSearch,setExSearch]=useState("");
  const COLS=["#c8f135","#4488ff","#ff8c42","#b44fff","#ff4488","#44ffdd"];
  const dw=kg=>Math.round(dispW(kg,unit)*10)/10;
  const exNames=[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort();
  const filteredNames=useMemo(()=>{if(!exSearch.trim())return exNames;const q=exSearch.toLowerCase();return exNames.filter(n=>n.toLowerCase().includes(q));},[exSearch,exNames]);
  const byEx={};
  workouts.forEach(w=>{w.exercises.forEach(ex=>{if(exFilter!=="all"&&ex.name!==exFilter)return;if(!byEx[ex.name])byEx[ex.name]=[];const maxORM=Math.max(...ex.sets.map(s=>calc1RM(s.w,s.r)));byEx[ex.name].push({date:w.date.slice(5),orm:dw(maxORM)});});});
  const allDates=[...new Set(workouts.map(w=>w.date))].sort().map(d=>d.slice(5));
  const lineData=allDates.map(d=>{const pt={date:d};Object.entries(byEx).forEach(([n,pts])=>{const f=pts.find(p=>p.date===d);if(f)pt[n]=f.orm;});return pt;});
  const prs={};workouts.forEach(w=>w.exercises.forEach(ex=>{ex.sets.forEach(s=>{const o=calc1RM(s.w,s.r);if(!prs[ex.name]||o>prs[ex.name].orm)prs[ex.name]={weight:s.w,reps:s.r,orm:o,date:w.date};});}));
  const muscleWeeks={};workouts.forEach(w=>{const wk=getWeekKey(w.date).replace(/\d{4}-/,"");w.exercises.forEach(ex=>{if(!muscleWeeks[wk])muscleWeeks[wk]={};muscleWeeks[wk][ex.muscle]=(muscleWeeks[wk][ex.muscle]||0)+ex.sets.reduce((s,set)=>s+(set.w||0)*(set.r||0),0);});});
  const wks=Object.keys(muscleWeeks).sort().slice(-4);
  const allMuscles=[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.muscle)))];
  const muscleData=wks.map(wk=>({week:wk,...Object.fromEntries(allMuscles.map(m=>[m,dw(muscleWeeks[wk]?.[m]||0)]))}));
  const series=Object.keys(byEx).slice(0,6);
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <div style={{display:"flex",gap:4}}>{["lb","kg"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{...S.btnS(unit===u),padding:"3px 10px",fontSize:12}}>{u}</button>)}</div>
      </div>
      <div style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div style={S.lbl}>1RM estimé ({unit})</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input value={exSearch} onChange={e=>{setExSearch(e.target.value);setExFilter("all");}} placeholder="🔍 Filtrer…" style={{...S.inp,width:180,fontSize:13}}/>
            <select value={exFilter} onChange={e=>setExFilter(e.target.value)} style={{...S.sel,width:"auto"}}><option value="all">Tous</option>{filteredNames.map(n=><option key={n}>{n}</option>)}</select>
          </div>
        </div>
        <LineSVG data={lineData} series={series} colors={COLS} height={220} unit={unit}/>
      </div>
      <div style={S.card}>
        <div style={S.lbl}>Volume par muscle — 4 dernières semaines ({unit})</div>
        <GroupedBarSVG data={muscleData} keys={allMuscles.slice(0,6)} colors={COLS} height={180}/>
      </div>
      <div style={S.card}>
        <div style={S.lbl}>Personal Records</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:8,marginTop:8}}>
          {Object.entries(prs).map(([name,pr])=>(
            <div key={name} style={{background:C.s2,borderRadius:8,padding:"10px 12px",border:`1px solid ${C.b2}`}}>
              <div style={{fontSize:12,fontWeight:600,color:C.tx,marginBottom:4}}>{name}</div>
              <div style={{fontSize:20,fontWeight:700,color:C.ac,fontFamily:"'DM Mono',monospace"}}>{dw(pr.orm)}<span style={{fontSize:12,color:C.mu}}>{unit}</span></div>
              <div style={{fontSize:11,color:C.mu,marginTop:2}}>{dw(pr.weight)}{unit}×{pr.reps} · {pr.date}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── History ──────────────────────────────────────────────────────────────────
function History({workouts,unit}){
  const sorted=[...workouts].sort((a,b)=>b.date.localeCompare(a.date));
  const tc={Push:C.ac,Pull:C.bl,Legs:C.or};
  const dw=kg=>Math.round(dispW(kg,unit));
  return(
    <div style={S.card}>
      <div style={S.lbl}>Séances ({sorted.length})</div>
      {sorted.map(w=>{
        const vol=dw(calcVol(w)),sets=w.exercises.reduce((t,e)=>t+e.sets.length,0);
        const muscles=[...new Set(w.exercises.map(e=>e.muscle).filter(Boolean))];
        const cc=tc[w.type]||C.mu;
        return(
          <div key={w.id} style={{padding:"12px 0",borderBottom:`1px solid ${C.b1}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:5}}>
              <span style={{fontSize:11,fontWeight:700,color:cc,background:cc+"20",padding:"2px 8px",borderRadius:4}}>{w.type}</span>
              <span style={{fontSize:12,color:C.mu}}>{w.date}</span>
              {String(w.id).startsWith("imp_")&&<span style={{fontSize:10,color:C.mu,background:C.s2,padding:"1px 6px",borderRadius:4}}>importé</span>}
              <span style={{marginLeft:"auto",fontSize:13,fontWeight:600,color:C.tx,fontFamily:"'DM Mono',monospace"}}>{vol.toLocaleString()} {unit}</span>
            </div>
            <div style={{fontSize:13,color:C.tx,marginBottom:4}}>{w.exercises.map(e=>e.name).join(" · ")}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:C.mu}}>{sets} sets</span>
              {muscles.map(m=><span key={m} style={{fontSize:11,color:C.mu,background:C.s2,padding:"1px 7px",borderRadius:4}}>{m}</span>)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
const TABS=[{id:"dashboard",label:"Dashboard"},{id:"log",label:"Log séance"},{id:"programs",label:"Programmes"},{id:"progress",label:"Progression"},{id:"history",label:"Historique"}];

async function fetchWorkouts(){
  try{
    const rows=await sbFetch("daily_logs?select=date,data&order=date.desc&limit=300");
    return rows.map(r=>r.data?importLog(r.data,r.date):null).filter(Boolean);
  }catch(e){console.error("Supabase fetch:",e);return[];}
}
async function saveWorkout(workout){
  try{
    const ex=await sbFetch(`daily_logs?date=eq.${workout.date}&select=*`);
    const exercises=workout.exercises.map(ex=>({id:Date.now()+Math.random(),name:ex.name,muscle:ex.muscle,unit:"lbs",sets:ex.sets.map(s=>({reps:String(s.r),weight:String(Math.round(dispW(s.w,"lb")*10)/10)})),isCustom:false}));
    if(ex&&ex[0]){const newData={...ex[0].data,exercises:[...(ex[0].data.exercises||[]),...exercises]};await sbFetch(`daily_logs?id=eq.${ex[0].id}`,{method:"PATCH",body:JSON.stringify({data:newData}),prefer:"return=minimal"});}
  }catch(e){console.error("Supabase save:",e);}
}

function App(){
  const[tab,setTab]=useState("dashboard");
  const[workouts,setWorkouts]=useState(SAMPLES);
  const[programs,setPrograms]=useState(DEFAULT_PROGRAMS);
  const[unit,setUnit]=useState("lb");
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const[syncSt,setSyncSt]=useState("loading");

  useEffect(()=>{
    fetchWorkouts().then(imported=>{
      if(imported(imported=>{
      if(imported.length>0){
        setWorkouts(prev=>{const sd=new Set(imported.map(w=>w.date));return[...prev.filter(w=>!w.id.startsWith("imp_")&&!sd.has(w.date)),...imported].sort((a,b)=>a.date.localeCompare(b.date));});
        setSyncSt("ok");
      }else setSyncSt("err");
      setLoading(false);
    });
  },[]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),3000);};
  const handleSave=async wo=>{
    setWorkouts(prev=>[...prev,wo].sort((a,b)=>a.date.localeCompare(b.date)));
    showToast("Séance sauvegardée 💪");
    setTab("dashboard");
    saveWorkout(wo);
  };

  const SB={loading:{label:"⟳ Sync…",color:C.bl},ok:{label:"✓ Supabase",color:C.ac},err:{label:"⚠ Local",color:C.or}};

  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.tx,fontFamily:"'DM Sans','Segoe UI',sans-serif"}}>
      <div style={{borderBottom:`1px solid ${C.b1}`,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",background:C.s1,position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:28,height:28,background:C.ac,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>💪</div>
          <span style={{fontWeight:700,fontSize:15}}>GymTracker</span>
          <span style={{fontSize:11,color:C.mu,background:C.s2,padding:"2px 8px",borderRadius:4}}>BETA</span>
          <span style={{fontSize:11,color:SB[syncSt].color,background:SB[syncSt].color+"18",padding:"2px 8px",borderRadius:4}}>{SB[syncSt].label}</span>
        </div>
        <span style={{fontSize:12,color:C.mu,fontFamily:"'DM Mono',monospace"}}>{new Intl.DateTimeFormat("fr-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}</span>
      </div>
      <div style={{display:"flex",borderBottom:`1px solid ${C.b1}`,background:C.s1,overflowX:"auto"}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",cursor:"pointer",padding:"12px 18px",fontSize:13,fontWeight:tab===t.id?600:400,color:tab===t.id?C.ac:C.mu,borderBottom:tab===t.id?`2px solid ${C.ac}`:"2px solid transparent",whiteSpace:"nowrap",transition:"all 0.15s"}}>{t.label}</button>)}
      </div>
      {loading?(
        <div style={{padding:"60px 24px",textAlign:"center",color:C.mu,fontSize:13}}>
          <div style={{fontSize:28,marginBottom:12,display:"inline-block",animation:"spin 1s linear infinite"}}>⟳</div>
          <div>Chargement depuis Supabase…</div>
        </div>
      ):(
        <div style={{padding:"20px 24px",maxWidth:1100,margin:"0 auto"}}>
          {tab==="dashboard"&&<Dashboard workouts={workouts} unit={unit} setUnit={setUnit}/>}
          {tab==="log"&&<LogWorkout onSave={handleSave} workouts={workouts} programs={programs} unit={unit} setUnit={setUnit}/>}
          {tab==="programs"&&<Programs programs={programs} setPrograms={setPrograms}/>}
          {tab==="progress"&&<Progression workouts={workouts} unit={unit} setUnit={setUnit}/>}
          {tab==="history"&&<History workouts={workouts} unit={unit}/>}
        </div>
      )}
      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:C.ac,color:"#0a0a0a",padding:"10px 22px",borderRadius:20,fontSize:13,fontWeight:600,zIndex:999}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
